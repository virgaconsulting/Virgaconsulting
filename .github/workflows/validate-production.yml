name: Validate vFiscal production build

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shell
        run: bash -n build.sh
      - name: Build production bundle
        run: bash build.sh
      - name: Inspect multi-year engine before upgrade
        run: python3 scripts/inspect_multiyear.py
      - name: Test fiscal calculations for multiple annualities
        run: node scripts/test_vfiscal_multiyear.cjs
      - name: Verify direct 5% and 15% selection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('dist/vfiscal-app.html').read_text()
          for marker in ['id="rate5"','id="rate15"','<option value="5">5%</option><option value="15">15%</option>','Aliquota selezionata nel profilo fiscale','Seleziona l’aliquota che si applica alla tua posizione']:
              assert marker in s, 'Missing rate selector: '+marker
          for obsolete in ['id="startup5Check"','id="profileStartup5Wrap"','Non posso salvare il 5%','Per applicare il 5% devi confermare','Fuori dalla finestra quinquennale dell’aliquota start-up']:
              assert obsolete not in s,'Unexpected tax-rate requirement: '+obsolete
          print('Direct 5%/15% rate selections and requirement removal: PASS')
          PY
          curl --fail --silent --show-error --location https://www.virgaconsulting.it/vfiscal-app | grep -q 'vFiscal non verifica automaticamente i requisiti fiscali'
      - name: Check first-year threshold calculations
        run: node scripts/test_vfiscal_threshold.cjs
      - name: Verify administrator and client account tools
        run: |
          node --check site-assets/vfiscal-account-tools.js
          node --check site-assets/vfiscal-financial-sync.js
          test -s dist/site-assets/vfiscal-account-tools.js
          test -s dist/site-assets/vfiscal-financial-sync.js
          grep -q 'vfiscal-account-tools.js' dist/vfiscal-admin.html
          grep -q 'vfiscal-account-tools.js' dist/vfiscal-app.html
          grep -q 'vfiscal-financial-sync.js' dist/vfiscal-app.html
          grep -q 'Copia credenziali' dist/vfiscal-admin.html
          grep -q 'Password provvisoria' dist/vfiscal-admin.html
          grep -q 'Cambia password' dist/site-assets/vfiscal-account-tools.js
          grep -q 'Elimina account selezionato' dist/site-assets/vfiscal-account-tools.js
      - name: Verify private aggregate studio reporting
        run: |
          node --check site-assets/vfiscal-studio-overview.js
          test -s dist/site-assets/vfiscal-studio-overview.js
          test -s dist/site-assets/vfiscal-studio-overview.css
          grep -q 'vfiscal-studio-overview.js' dist/vfiscal-admin.html
          grep -q 'vfiscal-studio-overview.css' dist/vfiscal-admin.html
          grep -q 'vfStudioAdminCall' dist/site-assets/vfiscal-account-tools.js
          grep -q 'studio_overview' dist/site-assets/vfiscal-studio-overview.js
          grep -q 'Panoramica dello Studio' dist/site-assets/vfiscal-studio-overview.js
          grep -q 'vf-studio-admin-signed-out' dist/site-assets/vfiscal-studio-overview.js
      - name: Verify redesigned dashboard and fiscal data
        run: |
          node --check site-assets/vfiscal-dashboard-v3.js
          node --input-type=module --check < site-assets/vfiscal-support.js
          python3 - <<'PY'
          from pathlib import Path
          checks=[
            ('javascript file',Path('dist/site-assets/vfiscal-dashboard-v3.js').is_file()),
            ('stylesheet file',Path('dist/site-assets/vfiscal-dashboard-v3.css').is_file()),
          ]
          html=Path('dist/vfiscal-app.html').read_text()
          js=Path('dist/site-assets/vfiscal-dashboard-v3.js').read_text()
          css=Path('dist/site-assets/vfiscal-dashboard-v3.css').read_text()
          support=Path('dist/site-assets/vfiscal-support.js').read_text()
          checks += [
            ('chart module', 'vf-dashboard-v3' in js),
            ('stylesheet linked', 'vfiscal-dashboard-v3.css' in html),
            ('script linked', 'vfiscal-dashboard-v3.js' in html),
            ('authenticated snapshot', 'window.vfAnalyticsSnapshot' in html),
            ('fiscal threshold function', 'vfThresholdForYear' in html),
            ('reserve model', 'reserveTarget:calc.matured' in html),
            ('first-year guidance', 'P.IVA aperta' in js),
            ('old charts removed', 'vf-visual-analytics' not in support),
            ('responsive layout', 'vfd-restyled' in css),
            ('correct mounting', 'mainDashboardContent' in js),
          ]
          for name,good in checks:print(('PASS' if good else 'FAIL')+' '+name)
          assert all(ok for _,ok in checks)
          PY
      - name: Verify release
        run: |
          test -f dist/release.txt
          grep -q "vfiscal-release-2026-10-05-2.8.2" dist/release.txt
          test -f dist/vfiscal-app.html
          test -f dist/acquista.html
          grep -q "window.VFISCAL_SUPABASE_URL" dist/vfiscal-app.html
          grep -q "vfiscal-cloudflare-v2.8.2-20261005" dist/sw.js
      - name: Wait for Cloudflare production
        run: |
          expected="vfiscal-release-2026-10-05-2.8.2"
          for i in $(seq 1 30); do
            current="$(curl --fail --silent --show-error --location --max-time 10 https://www.virgaconsulting.it/release.txt 2>/dev/null || true)"
            if [ "$current" = "$expected" ]; then
              echo "Production is on $expected"
              exit 0
            fi
            echo "Waiting for Cloudflare production ($i/30)..."
            sleep 10
          done
          echo "Production did not reach $expected in time"
          exit 1
      - name: Verify redesigned dashboard on production
        run: |
          set -e
          for i in $(seq 1 30); do
            curl --fail --silent --show-error --location --max-time 10 https://www.virgaconsulting.it/site-assets/vfiscal-dashboard-v3.js > /tmp/vfd-live.js || true
            curl --fail --silent --show-error --location --max-time 10 https://www.virgaconsulting.it/site-assets/vfiscal-dashboard-v3.css > /tmp/vfd-live.css || true
            curl --fail --silent --show-error --location --max-time 10 https://www.virgaconsulting.it/vfiscal-app > /tmp/vfd-live.html || true
            if grep -q 'vf-dashboard-v3' /tmp/vfd-live.js && grep -q 'vfd-restyled' /tmp/vfd-live.css && grep -q 'vfiscal-dashboard-v3.js' /tmp/vfd-live.html; then
              echo 'Redesigned dashboard is published on the live site.'
              exit 0
            fi
            echo "Waiting for live dashboard assets ($i/30)"
            sleep 10
          done
          echo 'Latest dashboard assets are not live'
          exit 1
      - name: Smoke test public vFiscal
        run: |
          curl --fail --silent --show-error --location https://www.virgaconsulting.it/vfiscal-app | grep -q "Area personale"
          curl --fail --silent --show-error --location https://www.virgaconsulting.it/acquista | grep -q "Inizia il tuo anno con vFiscal"
          curl --fail --silent --show-error --location https://www.virgaconsulting.it/sw.js | grep -q "vfiscal-cloudflare-v2.8.2-20261005"

      - name: Verify live multi-year simulator published
        run: |
          set -e
          for attempt in $(seq 1 25); do
            curl --fail --silent --show-error --location --max-time 12 https://www.virgaconsulting.it/vfiscal-app.html > /tmp/vf-multiyear-live.html || true
            if grep -q 'function vfRulesForYear(year)' /tmp/vf-multiyear-live.html &&
               grep -q 'Da accantonare su questo incasso' /tmp/vf-multiyear-live.html &&
               grep -q 'PREVISIONE-CON-REGOLE-2026' /tmp/vf-multiyear-live.html; then
              echo "Confirmed latest multi-year fiscal simulator is live."
              exit 0
            fi
            sleep 8
          done
          echo "New multi-year simulator not yet visible in production"
          exit 1
      - name: Verify studio overview deployed publicly but data private
        run: |
          for attempt in $(seq 1 24); do
            curl -fsSL --max-time 12 https://www.virgaconsulting.it/vfiscal-admin.html > /tmp/vfo-live.html || true
            curl -fsSL --max-time 12 https://www.virgaconsulting.it/site-assets/vfiscal-studio-overview.js > /tmp/vfo-live.js || true
            curl -fsSL --max-time 12 https://www.virgaconsulting.it/site-assets/vfiscal-studio-overview.css > /tmp/vfo-live.css || true
            if grep -q 'vfiscal-studio-overview.js' /tmp/vfo-live.html &&
               grep -q 'studio_overview' /tmp/vfo-live.js &&
               grep -q '#vf-studio-overview' /tmp/vfo-live.css; then
              echo 'Studio aggregate overview is published.'
              break
            fi
            if [ "$attempt" -eq 24 ]; then echo "Studio overview not live"; exit 1; fi
            sleep 8
          done
          result="$(curl --silent --output /tmp/vfo-unauth.json --write-out '%{http_code}' --max-time 12 \
            -X POST 'https://kytgwujzjahatblrkhgh.supabase.co/functions/v1/vfiscal-admin-clients' \
            -H 'Origin: https://www.virgaconsulting.it' \
            -H 'Content-Type: application/json' \
            -H 'apikey: sb_publishable_YqARTOD7oZD5Rg2vu6salQ_jGoGhHzY' \
            --data '{"action":"studio_overview","year":2026}')"
          test "$result" = "401" || test "$result" = "403"
          echo "Anonymous access refused ($result)."
      - name: Verify paid-only registration
        run: |
          app="$(curl --fail --silent --show-error --location https://www.virgaconsulting.it/vfiscal-app)"
          grep -q "vfiscal-register-paid" <<< "$app"
          if grep -q "auth.signUp(" <<< "$app"; then
            echo "Direct public Supabase sign-up is still exposed"
            exit 1
          fi
          grep -q 'id="vfRegisterModeBtn"' <<< "$app"
          grep -q 'style="display:none"' <<< "$app"

          admin="$(curl --fail --silent --show-error --location https://www.virgaconsulting.it/vfiscal-admin)"
          grep -q "Crea cliente" <<< "$admin"
          grep -q "Copia credenziali" <<< "$admin"
          grep -q "Gestione accesso esistente" <<< "$admin"
          grep -q "Torna al sito" <<< "$admin"
          grep -q "Apri vFiscal" <<< "$admin"

          app="$(curl --fail --silent --show-error --location https://www.virgaconsulting.it/vfiscal-app)"
          grep -q "Gestione clienti" <<< "$app"

          status="$(curl --silent --show-error --output /tmp/free-register.json --write-out "%{http_code}" \
            -X POST "https://kytgwujzjahatblrkhgh.supabase.co/functions/v1/vfiscal-register-paid" \
            -H "Origin: https://www.virgaconsulting.it" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_YqARTOD7oZD5Rg2vu6salQ_jGoGhHzY" \
            --data '{"email":"qa-vfiscal@example.com","password":"Testing123!","session_id":"cs_fake_no_payment"}')"
          test "$status" = "403"
          grep -q "acquisto vFiscal completato" /tmp/free-register.json

      - name: Verify auth, cache and purchase API
        run: |
          app="$(curl --fail --silent --show-error --location https://www.virgaconsulting.it/vfiscal-app)"
          echo "$app" | grep -q "window.VFISCAL_SUPABASE_URL"
          echo "$app" | grep -q "vfOpenRegisterMode"
          if echo "$app" | grep -q "Accesso temporaneamente non configurato"; then
            echo "Obsolete auth warning is still present"
            exit 1
          fi

          sw="$(curl --fail --silent --show-error --location https://www.virgaconsulting.it/sw.js)"
          echo "$sw" | grep -q "const DYNAMIC_PATHS"
          echo "$sw" | grep -q "/vfiscal-app"
          echo "$sw" | grep -q "/acquista"

          app_headers="$(curl --fail --silent --show-error --head https://www.virgaconsulting.it/vfiscal-app)"
          echo "$app_headers" | grep -qi "cache-control:.*no-store"
          buy_headers="$(curl --fail --silent --show-error --head https://www.virgaconsulting.it/acquista)"
          echo "$buy_headers" | grep -qi "cache-control:.*no-store"

          status="$(curl --silent --show-error --output /tmp/invalid-email.json --write-out "%{http_code}" \
            -X POST "https://kytgwujzjahatblrkhgh.supabase.co/functions/v1/vfiscal-start-purchase" \
            -H "Origin: https://www.virgaconsulting.it" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_YqARTOD7oZD5Rg2vu6salQ_jGoGhHzY" \
            --data '{"email":"not-an-email","terms_accepted":true}')"
          test "$status" = "400"
          grep -q "Inserisci un indirizzo email valido" /tmp/invalid-email.json

          status="$(curl --silent --show-error --output /tmp/no-terms.json --write-out "%{http_code}" \
            -X POST "https://kytgwujzjahatblrkhgh.supabase.co/functions/v1/vfiscal-start-purchase" \
            -H "Origin: https://www.virgaconsulting.it" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_YqARTOD7oZD5Rg2vu6salQ_jGoGhHzY" \
            --data '{"email":"qa-vfiscal@example.com","terms_accepted":false}')"
          test "$status" = "400"
          grep -q "Termini di servizio" /tmp/no-terms.json

      - name: Verify canonical domain and public essentials
        run: |
          set -e
          final="$(curl --fail --silent --show-error --location --output /dev/null --write-out "%{url_effective}" https://virgaconsulting.it)"
          test "$final" = "https://www.virgaconsulting.it/"

          final_path="$(curl --fail --silent --show-error --location --output /dev/null --write-out "%{url_effective}" "https://virgaconsulting.it/vfiscal.html?health=1")"
          test "$final_path" = "https://www.virgaconsulting.it/vfiscal?health=1"

          curl --fail --silent --show-error --location https://www.virgaconsulting.it/privacy | grep -q "Informativa privacy vFiscal"
          curl --fail --silent --show-error --location https://www.virgaconsulting.it/terms | grep -q "Termini di servizio vFiscal"
          curl --fail --silent --show-error --location https://www.virgaconsulting.it/support | grep -q "Assistenza"

          status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" https://www.virgaconsulting.it/this-page-should-not-exist-healthcheck)"
          test "$status" = "404"

      - name: Verify production security headers
        run: |
          set -e
          headers="$(curl --fail --silent --show-error --head https://www.virgaconsulting.it/)"
          echo "$headers" | grep -qi "strict-transport-security:.*max-age="
          echo "$headers" | grep -qi "x-content-type-options: *nosniff"
          echo "$headers" | grep -qi "referrer-policy: *strict-origin-when-cross-origin"
          echo "$headers" | grep -qi "x-frame-options: *SAMEORIGIN"
          echo "$headers" | grep -qi "content-security-policy:"
