name: Validate vFiscal production build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shell
        run: bash -n build.sh
      - name: Build production bundle
        run: bash build.sh
      - name: Inspect auth boot order
        run: |
          grep -n -E "VFISCAL_SUPABASE|vfConfigReady|vfEnsurePublicConfig|supabase-js|src/pwa.js|vfInitAuth" dist/vfiscal-app.html | head -80
      - name: Inspect registration flow
        run: |
          sed -n '3270,3345p' dist/vfiscal-app.html
      - name: Inspect admin actions
        run: |
          grep -n -E "vfiscal-admin-clients|grant|revoke|included|admin" dist/vfiscal-admin.html | tail -80
      - name: Verify release
        run: |
          test -f dist/release.txt
          grep -q "vfiscal-release-2026-10-05-2.7.0" dist/release.txt
          test -f dist/vfiscal-app.html
          test -f dist/acquista.html
          grep -q "window.VFISCAL_SUPABASE_URL" dist/vfiscal-app.html
          grep -q "vfiscal-cloudflare-v2.7.0-20261005" dist/sw.js
      - name: Wait for Cloudflare production
        run: |
          expected="vfiscal-release-2026-10-05-2.7.0"
          for i in $(seq 1 30); do
            current="$(curl --fail --silent --show-error --location --max-time 10 https://www.virgaconsulting.it/release.txt 2>/dev/null || true)"
            if [ "$current" = "$expected" ]; then
              echo "Production is on $expected"
              exit 0
            fi
            echo "Waiting for Cloudflare production ($i/30)..."
            sleep 10
          done
          echo "Production did not reach $expected in time"
          exit 1
      - name: Smoke test public vFiscal
        run: |
          curl --fail --silent --show-error --location https://www.virgaconsulting.it/vfiscal-app | grep -q "Area personale"
          curl --fail --silent --show-error --location https://www.virgaconsulting.it/acquista | grep -q "Inizia il tuo anno con vFiscal"
          curl --fail --silent --show-error --location https://www.virgaconsulting.it/sw.js | grep -q "vfiscal-cloudflare-v2.7.0-20261005"

      - name: Verify auth, cache and purchase API
        run: |
          app="$(curl --fail --silent --show-error --location https://www.virgaconsulting.it/vfiscal-app)"
          echo "$app" | grep -q "window.VFISCAL_SUPABASE_URL"
          echo "$app" | grep -q "vfOpenRegisterMode"
          if echo "$app" | grep -q "Accesso temporaneamente non configurato"; then
            echo "Obsolete auth warning is still present"
            exit 1
          fi

          sw="$(curl --fail --silent --show-error --location https://www.virgaconsulting.it/sw.js)"
          echo "$sw" | grep -q "const DYNAMIC_PATHS"
          echo "$sw" | grep -q "/vfiscal-app"
          echo "$sw" | grep -q "/acquista"

          app_headers="$(curl --fail --silent --show-error --head https://www.virgaconsulting.it/vfiscal-app)"
          echo "$app_headers" | grep -qi "cache-control:.*no-store"
          buy_headers="$(curl --fail --silent --show-error --head https://www.virgaconsulting.it/acquista)"
          echo "$buy_headers" | grep -qi "cache-control:.*no-store"

          status="$(curl --silent --show-error --output /tmp/invalid-email.json --write-out "%{http_code}" \
            -X POST "https://kytgwujzjahatblrkhgh.supabase.co/functions/v1/vfiscal-start-purchase" \
            -H "Origin: https://www.virgaconsulting.it" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_YqARTOD7oZD5Rg2vu6salQ_jGoGhHzY" \
            --data '{"email":"not-an-email","terms_accepted":true}')"
          test "$status" = "400"
          grep -q "Inserisci un indirizzo email valido" /tmp/invalid-email.json

          status="$(curl --silent --show-error --output /tmp/no-terms.json --write-out "%{http_code}" \
            -X POST "https://kytgwujzjahatblrkhgh.supabase.co/functions/v1/vfiscal-start-purchase" \
            -H "Origin: https://www.virgaconsulting.it" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_YqARTOD7oZD5Rg2vu6salQ_jGoGhHzY" \
            --data '{"email":"qa-vfiscal@example.com","terms_accepted":false}')"
          test "$status" = "400"
          grep -q "Termini di servizio" /tmp/no-terms.json
